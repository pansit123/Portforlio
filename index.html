function makeVibrantSkyGradient() {
  const canvas = document.createElement("canvas");
  canvas.width = 16; 
  canvas.height = 512;
  const ctx = canvas.getContext("2d");
  const grad = ctx.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0.0, "#2f9bf0");
  grad.addColorStop(0.6, "#70b5ff");
  grad.addColorStop(1.0, "#bdeaff"); 
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 16, 512);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function generateWoodFloorTexture() {
  const canvas = document.createElement("canvas");
  canvas.width = 1024;
  canvas.height = 1024;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#a97c50";
  ctx.fillRect(0, 0, 1024, 1024);

  const numPlanks = 16;
  const plankHeight = 1024 / numPlanks;
  
  for (let i = 0; i < numPlanks; i++) {
    const y = i * plankHeight;
    const shade = Math.sin(i * 12.5) * 12;
    ctx.fillStyle = `rgb(${169 + shade}, ${124 + shade * 0.8}, ${80 + shade * 0.5})`;
    ctx.fillRect(0, y, 1024, plankHeight - 3);
    
    ctx.fillStyle = "#5c3312";
    ctx.fillRect(0, y + plankHeight - 3, 1024, 3);
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(2, 2);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

const terracottaMat = new THREE.MeshStandardMaterial({ color: 0xb5633f, roughness: 0.8, metalness: 0.05 });

const petalMatYellow = new THREE.MeshStandardMaterial({ color: 0xffd24c, roughness: 0.5 });

function makeFlowerPot(petalMat) {
  const group = new THREE.Group();
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.12, 0.22, 16), terracottaMat);
  pot.position.y = 0.11;
  pot.castShadow = true; pot.receiveShadow = true;
  group.add(pot);

  for (let i = 0; i < 3; i++) {
    const angle = (i / 3) * Math.PI * 2;
    const stemH = 0.3 + Math.random() * 0.08;
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, stemH, 6), stemMat);
    stem.position.set(Math.cos(angle) * 0.05, 0.22 + stemH / 2, Math.sin(angle) * 0.05);
    stem.castShadow = true;
    group.add(stem);

    const flowerGroup = new THREE.Group();
    const center = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), flowerCenterMat);
    flowerGroup.add(center);
    for (let p = 0; p < 5; p++) {
      const pa = (p / 5) * Math.PI * 2;
      const petal = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 6), petalMat);
      petal.position.set(Math.cos(pa) * 0.055, 0, Math.sin(pa) * 0.055);
      petal.scale.set(1, 0.6, 1);
      flowerGroup.add(petal);
    }
    flowerGroup.position.set(Math.cos(angle) * 0.05, 0.22 + stemH, Math.sin(angle) * 0.05);
    flowerGroup.traverse(o => { if (o.isMesh) o.castShadow = true; });
    group.add(flowerGroup);
  }
  return group;
}

function drawGlowingNeonText(text, x, y, fontSize, strokeColor, fillColor) {
  mCtx.font = `Bold ${fontSize}px 'Segoe UI', 'Tahoma', sans-serif`;
  mCtx.shadowColor = strokeColor;
  mCtx.shadowBlur = 35;
  mCtx.fillStyle = strokeColor;
  mCtx.fillText(text, x, y);
  mCtx.shadowBlur = 15;
  mCtx.fillText(text, x, y);
  mCtx.shadowBlur = 4;
  mCtx.fillStyle = fillColor;
  mCtx.fillText(text, x, y);
}

photoTexture.colorSpace = THREE.SRGBColorSpace;

const photoMat = new THREE.MeshBasicMaterial({ map: photoTexture });
const photoPlane = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.78), photoMat);
photoPlane.position.z = 0.024;
photoFrameGroup.add(photoPlane);

photoFrameGroup.position.set(-0.1, 1.58, -3.4);
photoFrameGroup.rotation.y = 0.2;
photoFrameGroup.traverse(o => { if (o.isMesh) o.castShadow = true; });
room.add(photoFrameGroup);

let isAnimating = false;
let targetCamPos = new THREE.Vector3().copy(camera.position);
let targetLookAt = new THREE.Vector3().copy(controls.target);

function moveCameraTo(cx, cy, cz, tx, ty, tz) {
  targetCamPos.set(cx, cy, cz);
  targetLookAt.set(tx, ty, tz);
  isAnimating = true;
}

document.getElementById('btn-overview').onclick  = () => moveCameraTo(6.5, 5, 7.5, 0, 1.2, 0);
document.getElementById('btn-pc').onclick        = () => moveCameraTo(0.6, 2.0, -1.8, 0.6, 1.62, -3.75);
document.getElementById('btn-desk').onclick      = () => moveCameraTo(2.2, 2.8, -1.0, 0.6, 1.2, -3.2);
document.getElementById('btn-menu').onclick      = () => moveCameraTo(-1.8, 3.2, 1.5, -4.68, 3.2, 1.5);
document.getElementById('btn-photo').onclick     = () => moveCameraTo(-0.1, 1.62, -2.4, -0.1, 1.58, -3.4);
document.getElementById('btn-window').onclick    = () => moveCameraTo(-1.5, 3.0, 1.5, -4.68, 3.0, -1.5);
document.getElementById('btn-portfolio').onclick = () => moveCameraTo(6.5, 5, 7.5, 0, 1.2, 0);

function updateUI() {
  document.getElementById('cam-x').innerText = camera.position.x.toFixed(2);
  document.getElementById('cam-y').innerText = camera.position.y.toFixed(2);
  document.getElementById('cam-z').innerText = camera.position.z.toFixed(2);

  document.getElementById('tar-x').innerText = controls.target.x.toFixed(2);
  document.getElementById('tar-y').innerText = controls.target.y.toFixed(2);
  document.getElementById('tar-z').innerText = controls.target.z.toFixed(2);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);

  if (isAnimating) {
    camera.position.lerp(targetCamPos, 0.08);
    controls.target.lerp(targetLookAt, 0.08);

    if (camera.position.distanceTo(targetCamPos) < 0.01 && controls.target.distanceTo(targetLookAt) < 0.01) {
      camera.position.copy(targetCamPos);
      controls.target.copy(targetLookAt);
      isAnimating = false;
    }
  }

  controls.update();
  updateUI();
  renderer.render(scene, camera);
}

animate();
</script>
